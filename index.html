<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B0F14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Abdul Cadre">

    <title>Abdul Cadre</title>
    <meta name="description" content="Abdul Cadre — Mobile developer (B4X / Android), lecturer and ICT trainer in Mozambique.">
    <meta name="author" content="Abdul Cadre">
    <meta name="robots" content="index, follow, max-image-preview:large">

    <link rel="canonical" href="https://abdullcadre.github.io/">
    <link rel="alternate" hreflang="en" href="https://abdullcadre.github.io/">
    <link rel="alternate" hreflang="pt" href="https://abdullcadre.github.io/?lang=pt">
    <link rel="alternate" hreflang="x-default" href="https://abdullcadre.github.io/">

    <meta property="og:type" content="profile">
    <meta property="og:title" content="Abdul Cadre — B4X/Android Developer, Lecturer & ICT Trainer">
    <meta property="og:description" content="Portfolio of Abdul Cadre — mobile developer (B4X / Android), lecturer and ICT trainer in Mozambique.">
    <meta property="og:url" content="https://abdullcadre.github.io/">
    <meta property="og:image" content="https://abdullcadre.github.io/og-image.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'], mono: ['JetBrains Mono','monospace'] } } }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans antialiased">

    <div id="noise-overlay" aria-hidden="true"></div>

    <div id="glow-cursor-root" aria-hidden="true">
        <canvas id="glow-canvas"></canvas>
    </div>
    <canvas id="spark-canvas" aria-hidden="true"></canvas>

    <div id="crosshair">
        <div class="ch-dot" id="ch-dot"></div> 
        <div class="ch-target-box" id="ch-target-box">
            <span class="ch-corner tl"></span><span class="ch-corner tr"></span>
            <span class="ch-corner bl"></span><span class="ch-corner br"></span>
            <span class="ch-target-label" id="ch-target-label"></span>
        </div>
    </div>

    <!-- Header (loaded from include/header.html) -->
    <div id="header-slot"></div>

    <div id="dots"></div>
    <div id="mobile-indicator" aria-hidden="true"></div>
    <div id="scroll-hint"><span class="arrow">Scroll ↓</span></div>

    <div id="scroller">
        <!-- Sessions loaded dynamically from sessions/*.html based on data.js nav -->
    </div>

    <!-- Footer (loaded from include/footer.html) -->
    <div id="footer-slot"></div>

    <nav class="mobile-nav" id="mobile-nav"></nav>

    <!-- MODAL -->
    <div id="modal-overlay" class="modal-overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-backdrop" data-modal-close></div>
        <div class="modal-panel" role="document">
            <button class="modal-close" data-modal-close aria-label="Close">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <div class="modal-head">
                <div class="modal-icon" id="modal-icon"></div>
                <div class="modal-head-text">
                    <span class="modal-tag" id="modal-tag"></span>
                    <h2 class="modal-title" id="modal-title"></h2>
                </div>
            </div>
            <p class="modal-desc" id="modal-desc"></p>
            <div class="modal-meta" id="modal-meta"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <!-- Includes (JS templates — works on file:// and HTTP) -->
    <script src="include/header.js"></script>
    <script src="include/footer.js"></script>

    <!-- Sessions (JS templates) -->
    <script src="sessions/hero.js"></script>
    <script src="sessions/skills.js"></script>
    <script src="sessions/projects.js"></script>
    <script src="sessions/education.js"></script>
    <script src="sessions/quote.js"></script>
    <script src="sessions/contact.js"></script>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
