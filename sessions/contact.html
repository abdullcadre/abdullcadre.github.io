<!-- CONTACT -->
<section id="contact" class="snap-section">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 w-full my-auto fit-content">
        <div class="fade-content panel rounded-xl p-6 sm:p-10" style="background: var(--surface); border: 1px solid var(--border);">
            <div class="section-noise" aria-hidden="true"></div>
            <div class="relative z-10">
                <div class="mb-5">
                    <div class="inline-flex items-center gap-2 text-xs font-mono mb-2" style="color: var(--accent);">
                        <i data-lucide="contact" class="w-3.5 h-3.5"></i>
                        <span id="contact-tag">Contacts</span>
                    </div>
                    <h2 class="text-2xl sm:text-3xl font-bold tracking-tight mb-2" id="contact-title">Get in Touch</h2>
                    <p class="text-xs sm:text-sm hidden" style="color: var(--text-muted);" id="contact-subtitle"></p>
                </div>
                <div class="contact-list" id="contact-list"></div>
            </div>
        </div>
    </div>
</section>
